<svg viewBox="0 0 1080 1236" xmlns="http://www.w3.org/2000/svg" aria-label="Eos Analytics logo">
  <style>
    .b1-fill { animation: fillRed 3s ease-out 0.3s forwards; }
    .b2-fill { animation: fillRed 3s ease-out 1s forwards; }
    .b3-fill { animation: fillRed 3s ease-out 1.7s forwards; }
    @keyframes fillRed {
      0%   { fill: #b8bbc4; }
      100% { fill: #ff0040; }
    }
  </style>

  <!-- Círculo exterior (sin animación) -->
  <path fill="#b8bbc4" d="M540 20 C250 20 20 270 20 618 C20 966 250 1216 540 1216 C830 1216 1060 966 1060 618 C1060 270 830 20 540 20 Z M540 60 C800 60 1010 290 1010 618 C1010 946 800 1176 540 1176 C280 1176 70 946 70 618 C70 290 280 60 540 60 Z"/>

  <!-- Barra INFERIOR: base completa -->
  <polygon points="260,905 815,905 795,950 280,950" fill="#b8bbc4"/>
  <polygon class="b1-fill" points="340,905 735,905 720,950 355,950" fill="#b8bbc4"/>

  <!-- Barra MEDIA: solo el segmento central -->
  <rect x="310" y="595" width="455" height="52" fill="#b8bbc4"/>
  <rect class="b2-fill" x="420" y="595" width="240" height="52" fill="#b8bbc4"/>

  <!-- Barra SUPERIOR: solo un segmento pequeño (la punta) -->
  <polygon points="260,305 815,305 775,350 300,350" fill="#b8bbc4"/>
  <polygon class="b3-fill" points="490,305 590,305 585,350 495,350" fill="#b8bbc4"/>
</svg>